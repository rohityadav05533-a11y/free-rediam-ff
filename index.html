<script>

/* Google OAuth Client ID */

/* YouTube Channel */
const CHANNEL_HANDLE = "realrohit07realrohit07";

let targetChannelId = null;
let accessToken = null;

function openYouTube(){

window.open(
"https://youtube.com/@realrohit07realrohit07",
"_blank"
);

setTimeout(() => {
startGoogleVerification();
},1000);

}

function openTelegram(){

function startGoogleVerification(){

const message =
document.getElementById("verifyMessage");

message.innerText =
"🔄 YouTube Subscription Verify हो रही है...";

if(!window.google || !google.accounts){

message.innerText =
"❌ Google Login तैयार नहीं है।";

return;

}

const tokenClient =
google.accounts.oauth2.initTokenClient({

client_id:CLIENT_ID,

scope:
"https://www.googleapis.com/auth/youtube.readonly",

callback:async(response)=>{

if(response.error){

message.innerText =
"❌ Google verification नहीं हुई।";

return;

}

accessToken =
response.access_token;

await verifySubscription();

}

});

tokenClient.requestAccessToken({
prompt:"consent"
});

}

async function findChannelId(){

const url =
"https://www.googleapis.com/youtube/v3/channels" +
"?part=id" +
"&forHandle=" +
encodeURIComponent(CHANNEL_HANDLE) +
"&key=" +
encodeURIComponent(API_KEY);

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Channel API Error: " +
response.status
);

}

const data =
await response.json();

if(!data.items || data.items.length===0){

throw new Error("Channel नहीं मिला");

}

return data.items[0].id;

}

async function verifySubscription(){

const message =
document.getElementById("verifyMessage");

try{

targetChannelId =
await findChannelId();

let pageToken = "";

while(true){

let url =
"https://www.googleapis.com/youtube/v3/subscriptions" +
"?part=snippet" +
"&mine=true" +
"&maxResults=50" +
"&access_token=" +
encodeURIComponent(accessToken);

if(pageToken){

url +=
"&pageToken=" +
encodeURIComponent(pageToken);

}

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Subscription API Error: " +
response.status
);

}

const data =
await response.json();

if(data.items){

for(const item of data.items){

const subscribedChannel =
item.snippet.resourceId.channelId;

if(subscribedChannel === targetChannelId){

message.innerText =
"✅ YouTube Subscribe Verify हो गया!";

const startBtn =
document.getElementById("startBtn");

startBtn.disabled = false;

startBtn.innerText =
"🚀 START TOURNAMENT";

return;

}

}

}

if(!data.nextPageToken){

break;

}

pageToken =
data.nextPageToken;

}

message.innerText =
"❌ इस चैनल की Subscription नहीं मिली।";

}catch(error){

console.error(error);

message.innerText =
"❌ Verification में समस्या हुई।";

}

}

function showTournaments(){

document
.getElementById("tournaments")
.classList.remove("hidden");

}

function joinTournament(name){

document
.getElementById("joinBox")
.classList.remove("hidden");

document
.getElementById("selectedTournament")
.innerText =
"🏆 Tournament: " + name;

document
.getElementById("joinBox")
.scrollIntoView({
behavior:"smooth"
});

}

function submitJoin(){

const uid =
document.getElementById("uid").value.trim();

const playerName =
document.getElementById("playerName").value.trim();

const message =
document.getElementById("joinMessage");

if(!uid){

message.innerText =
"❌ UID डालें।";

return;

}

if(!playerName){

message.innerText =
"❌ In-Game Name डालें।";

return;

}

if(uid.length < 5){

message.innerText =
"❌ सही Free Fire UID डालें।";

return;

}

message.innerText =
"✅ Join Request Submit हो गई!";

document.getElementById("uid").value="";
document.getElementById("playerName").value="";

}

</script>
